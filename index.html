<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simulador del Mundial FIFA 2026 — Grupo A" />
  <title>Simulador Mundial FIFA 2026</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ── Cabecera ──────────────────────────────────────────────────────── -->
  <header class="site-header">
    <h1>⚽ MUNDIAL FIFA 2026</h1>
    <p class="subtitle">Simulador de grupos &amp; resultados</p>
  </header>

  <main class="main-container">

    <!-- ── Tarjeta de grupo ────────────────────────────────────────────── -->
    <div class="card">
      <div class="card-body" id="group-card">
        <!-- Renderizado por app.js -->
      </div>
    </div>

    <!-- ── Fixture ────────────────────────────────────────────────────── -->
    <div class="card">
      <div class="card-header">Partidos</div>
      <div class="card-body">
        <div id="fixtures">
          <!-- Renderizado por app.js -->
        </div>
      </div>
      <!-- Botón de reinicio -->
      <div class="actions-bar">
        <button class="btn-reset" id="btn-reset" type="button">
          🔄 Reiniciar Grupo A
        </button>
      </div>
    </div>

    <!-- ── Tabla de posiciones ────────────────────────────────────────── -->
    <div class="card">
      <div class="card-header">Tabla de Posiciones</div>
      <div class="card-body">
        <div class="standings-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th class="team-col">Equipo</th>
                <th title="Partidos Jugados">PJ</th>
                <th title="Ganados">PG</th>
                <th title="Empatados">PE</th>
                <th title="Perdidos">PP</th>
                <th title="Goles a Favor">GF</th>
                <th title="Goles en Contra">GC</th>
                <th title="Diferencia de Gol">DG</th>
                <th title="Puntos">PTS</th>
              </tr>
            </thead>
            <tbody id="standings-body">
              <!-- Renderizado por app.js -->
            </tbody>
          </table>
        </div>

        <!-- Clasificados -->
        <div class="qualified-section">
          <h4>Clasificados</h4>
          <ol id="qualified-list">
            <!-- Renderizado por app.js -->
          </ol>
        </div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    Mundial FIFA 2026 · Simulador no oficial
  </footer>

  <!-- ES Modules — compatible con GitHub Pages sin bundler -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
