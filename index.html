<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simulador del Mundial FIFA 2026 — Todos los grupos" />
  <title>Simulador Mundial FIFA 2026</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <h1>⚽ MUNDIAL FIFA 2026</h1>
    <p class="subtitle">Simulador de grupos &amp; resultados</p>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn tab-btn--active" data-tab="groups">Fase de Grupos</button>
    <button class="tab-btn" data-tab="thirds">Mejores Terceros</button>
    <button class="tab-btn" data-tab="bracket">Fase Final</button>
  </nav>

  <main class="main-container">
    <div id="phase-groups">
      <div id="groups-grid" class="groups-grid"></div>
    </div>
    <div id="phase-thirds" class="hidden"></div>
    <div id="phase-bracket" class="hidden">
      <div id="bracket-root"></div>
    </div>
  </main>

  <footer class="site-footer">
    Mundial FIFA 2026 · Simulador no oficial
  </footer>

  <script type="module" src="js/app.js"></script>

</body>
</html>
